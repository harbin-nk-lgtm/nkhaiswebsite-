<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Election</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #7b2ff7);
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      font-size: 18px;
      margin-bottom: 0;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .job {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .job h2 {
      color: #4f46e5;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .candidates {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .candidate {
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      cursor: pointer;
      background: #fafafa;
      transition: 0.2s;
      text-align: center;
    }

    .candidate:hover {
      transform: translateY(-2px);
      border-color: #6366f1;
      background: #eef2ff;
    }

    .candidate.selected {
      border-color: #16a34a;
      background: #dcfce7;
    }

    .candidate input {
      margin-right: 8px;
    }

    .vote-button {
      display: block;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      margin: 25px 0;
    }

    .vote-button:hover {
      background: #15803d;
    }

    .message {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      padding: 15px;
      display: none;
      border-radius: 10px;
      background: #dcfce7;
      color: #166534;
    }

    .results {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 40px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .results h2 {
      text-align: center;
      color: #4f46e5;
    }

    .result-section {
      margin-bottom: 25px;
    }

    .result-section h3 {
      color: #111827;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .name {
      width: 110px;
      font-weight: bold;
    }

    .bar-container {
      flex: 1;
      height: 25px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #9333ea);
      transition: width 0.4s;
    }

    .count {
      width: 45px;
      font-weight: bold;
      text-align: right;
    }

    footer {
      text-align: center;
      color: white;
      padding: 20px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }

      .name {
        width: 85px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🗳️ Class Election</h1>
  <p>Choose one candidate for each position.</p>
</header>

<div class="container">

  <div id="message" class="message">
    Your vote has been recorded!
  </div>

  <!-- PRESIDENT -->
  <section class="job">
    <h2>🏛️ President</h2>

    <div class="candidates">
      <label class="candidate">
        <input type="radio" name="president" value="Erick">
        Erick
      </label>

      <label class="candidate">
        <input type="radio" name="president" value="Sarracha">
        Sarracha
      </label>
    </div>
  </section>

  <!-- VICE PRESIDENT -->
  <section class="job">
    <h2>⭐ Vice President</h2>

    <div class="candidates">
      <label class="candidate">
        <input type="radio" name="vice" value="Marquell">
        Marquell
      </label>

      <label class="candidate">
        <input type="radio" name="vice" value="Nkhai">
        Nkhai
      </label>

      <label class="candidate">
        <input type="radio" name="vice" value="Axel.W">
        Axel.W
      </label>

      <label class="candidate">
        <input type="radio" name="vice" value="Nathainel">
        Nathainel
      </label>
    </div>
  </section>

  <!-- SHERIFF -->
  <section class="job">
    <h2>⭐ Sheriff</h2>

    <div class="candidates">
      <label class="candidate">
        <input type="radio" name="sheriff" value="Axel.V">
        Axel.V
      </label>

      <label class="candidate">
        <input type="radio" name="sheriff" value="Dennis">
        Dennis
      </label>

      <label class="candidate">
        <input type="radio" name="sheriff" value="Jose">
        Jose
      </label>

      <label class="candidate">
        <input type="radio" name="sheriff" value="Mayonaise">
        Mayonaise
      </label>

      <label class="candidate">
        <input type="radio" name="sheriff" value="Esmay">
        Esmay
      </label>

      <label class="candidate">
        <input type="radio" name="sheriff" value="Dylan.R">
        Dylan.R
      </label>

      <label class="candidate">
        <input type="radio" name="sheriff" value="Rey">
        Rey
      </label>

      <label class="candidate">
        <input type="radio" name="sheriff" value="Franclin">
        Franclin
      </label>
    </div>
  </section>

  <!-- JUDGE -->
  <section class="job">
    <h2>⚖️ Judge</h2>

    <div class="candidates">
      <label class="candidate">
        <input type="radio" name="judge" value="Victor">
        Victor
      </label>

      <label class="candidate">
        <input type="radio" name="judge" value="Mecca">
        Mecca
      </label>

      <label class="candidate">
        <input type="radio" name="judge" value="Kevin">
        Kevin
      </label>

      <label class="candidate">
        <input type="radio" name="judge" value="Neveah">
        Neveah
      </label>

      <label class="candidate">
        <input type="radio" name="judge" value="Omar">
        Omar
      </label>

      <label class="candidate">
        <input type="radio" name="judge" value="Dylan.V">
        Dylan.V
      </label>

      <label class="candidate">
        <input type="radio" name="judge" value="Esmerlda">
        Esmerlda
      </label>

      <label class="candidate">
        <input type="radio" name="judge" value="Itzel">
        Itzel
      </label>
    </div>
  </section>

  <button class="vote-button" onclick="submitVote()">
    🗳️ SUBMIT MY VOTE
  </button>

  <!-- RESULTS -->
  <section class="results">
    <h2>📊 Current Results</h2>

    <div class="result-section">
      <h3>President</h3>
      <div id="presidentResults"></div>
    </div>

    <div class="result-section">
      <h3>Vice President</h3>
      <div id="viceResults"></div>
    </div>

    <div class="result-section">
      <h3>Sheriff</h3>
      <div id="sheriffResults"></div>
    </div>

    <div class="result-section">
      <h3>Judge</h3>
      <div id="judgeResults"></div>
    </div>
  </section>

</div>

<footer>
  Class Election • Make your choice!
</footer>


<script>

  // Vote storage
  const votes = {
    president: {
      Erick: 0,
      Sarracha: 0
    },

    vice: {
      Marquell: 0,
      Nkhai: 0,
      "Axel.W": 0,
      Nathainel: 0
    },

    sheriff: {
      "Axel.V": 0,
      Dennis: 0,
      Jose: 0,
      Mayonaise: 0,
      Esmay: 0,
      "Dylan.R": 0,
      Rey: 0,
      Franclin: 0
    },

    judge: {
      Victor: 0,
      Mecca: 0,
      Kevin: 0,
      Neveah: 0,
      Omar: 0,
      "Dylan.V": 0,
      Esmerlda: 0,
      Itzel: 0
    }
  };


  function submitVote() {

    const president =
      document.querySelector('input[name="president"]:checked');

    const vice =
      document.querySelector('input[name="vice"]:checked');

    const sheriff =
      document.querySelector('input[name="sheriff"]:checked');

    const judge =
      document.querySelector('input[name="judge"]:checked');


    // Make sure every position has a vote
    if (!president || !vice || !sheriff || !judge) {
      alert("Please choose one candidate for every position.");
      return;
    }


    // Add votes
    votes.president[president.value]++;
    votes.vice[vice.value]++;
    votes.sheriff[sheriff.value]++;
    votes.judge[judge.value]++;


    // Show message
    const message = document.getElementById("message");

    message.style.display = "block";
    message.textContent = "✅ Your vote has been recorded!";


    // Clear selections
    document
      .querySelectorAll('input[type="radio"]')
      .forEach(input => input.checked = false);


    // Update results
    updateResults();


    // Scroll to results
    document
      .querySelector(".results")
      .scrollIntoView({ behavior: "smooth" });
  }


  function updateResults() {

    createResults(
      "presidentResults",
      votes.president
    );

    createResults(
      "viceResults",
      votes.vice
    );

    createResults(
      "sheriffResults",
      votes.sheriff
    );

    createResults(
      "judgeResults",
      votes.judge
    );
  }


  function createResults(elementId, data) {

    const container =
      document.getElementById(elementId);

    container.innerHTML = "";


    const values = Object.values(data);

    const highest =
      Math.max(...values, 1);


    for (const candidate in data) {

      const row =
        document.createElement("div");

      row.className = "result-row";


      const name =
        document.createElement("div");

      name.className = "name";

      name.textContent = candidate;


      const barContainer =
        document.createElement("div");

      barContainer.className =
        "bar-container";


      const bar =
        document.createElement("div");

      bar.className = "bar";


      const percentage =
        (data[candidate] / highest) * 100;

      bar.style.width =
        percentage + "%";


      const count =
        document.createElement("div");

      count.className = "count";

      count.textContent =
        data[candidate];


      barContainer.appendChild(bar);

      row.appendChild(name);

      row.appendChild(barContainer);

      row.appendChild(count);

      container.appendChild(row);
    }
  }


  // Make selected choices look highlighted
  document
    .querySelectorAll(".candidate")
    .forEach(label => {

      label.addEventListener("click", () => {

        const group =
          label.querySelector("input").name;

        document
          .querySelectorAll(
            `input[name="${group}"]`
          )
          .forEach(input => {

            input
              .parentElement
              .classList
              .remove("selected");

          });


        label.classList.add("selected");
      });

    });


  // Show initial results
  updateResults();

</script>

</body>
</html>
